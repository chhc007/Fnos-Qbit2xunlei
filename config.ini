# qBit → 迅雷 自动转存配置文件
# 复制此文件为 config.ini 并填写实际值

[qbittorrent]
# qBittorrent Web UI 地址
QB_HOST = https://qbit.shieldwork.cn:83/
QB_USER = shield
QB_PASS = 2261112chd..

[nas]
# NAS (飞牛 fnOS) 配置
NAS_HOST = 192.168.123.146
NAS_PORT = 5666
NAS_USER = shield
NAS_PASS = 2261112Chd..

# 迅雷下载路径（留空使用迅雷默认路径）
# 示例: /vol5/1000/影视库/下载/迅雷下载影视
XUNLEI_DOWNLOAD_PATH = /vol5/1000/影视库/下载/迅雷下载影视

# qBit 保存路径前缀（去除后拼接到迅雷路径）
# 示例: qBit 任务保存路径是 /downloads/电影/华语电影
#   QBIT_SAVE_PATH_PREFIX = /downloads
#   XUNLEI_BASE_PATH = /vol5/1000/影视库/下载/迅雷下载影视
#   最终迅雷路径 = /vol5/1000/影视库/下载/迅雷下载影视/电影/华语电影
# 留空则不映射，直接用 XUNLEI_DOWNLOAD_PATH
QBIT_SAVE_PATH_PREFIX = /downloads
XUNLEI_BASE_PATH = /vol5/1000/影视库/下载/迅雷下载影视

[general]
# 检查间隔（秒）
CHECK_INTERVAL = 10

# 触发转存的标签名
TARGET_LABEL = 迅雷

# 删除 qBit 任务时是否同时删除文件
DELETE_FILES = false

# 最大同时转存任务数
MAX_CONCURRENT = 3

# 比速观察时长（秒）
SPEED_CHECK_DURATION = 40

# 比速采样间隔（秒）
SPEED_CHECK_INTERVAL = 5

# 提交后等待迅雷开始的秒数
INITIAL_WAIT = 10

# 最低有效速度（bytes/s），低于此视为“没速度”
MIN_SPEED_BYTES = 10

# 0速度超时自动清理（true/false）
ZERO_SPEED_ENABLED = false

# 0速度超时（分钟）：下载任务持续0速度超过此时间则自动删除
ZERO_SPEED_TIMEOUT = 10
